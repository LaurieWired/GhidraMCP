name: Check for New Ghidra Release

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current Ghidra version from repo
        id: current_version
        run: |
          CURRENT_VERSION=$(grep "GHIDRA_VERSION:" .github/workflows/build.yml | awk '{print $2}')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Get latest Ghidra release
        id: latest_release
        run: |
          # Fetch latest release from GitHub API
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest | jq -r '.tag_name')
          # Extract version number (e.g., Ghidra_11.4.2_build -> 11.4.2)
          LATEST_VERSION=$(echo $LATEST_RELEASE | sed 's/Ghidra_//;s/_build//')
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST_VERSION"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          LATEST="${{ steps.latest_release.outputs.version }}"

          echo "Current: $CURRENT"
          echo "Latest: $LATEST"

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "New Ghidra version available: $LATEST (current: $CURRENT)"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Ghidra version is up to date"
          fi

      - name: Create issue for new release
        if: steps.compare.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const currentVersion = '${{ steps.current_version.outputs.version }}';
            const latestVersion = '${{ steps.latest_release.outputs.version }}';
            const latestTag = '${{ steps.latest_release.outputs.tag }}';

            const issueTitle = `Update to Ghidra ${latestVersion}`;
            const issueBody = `A new version of Ghidra has been released!

            **Current Version:** ${currentVersion}
            **New Version:** ${latestVersion}
            **Release Tag:** ${latestTag}
            **Release URL:** https://github.com/NationalSecurityAgency/ghidra/releases/tag/${latestTag}

            ## Action Items:
            - [ ] Review release notes for API changes
            - [ ] Update version numbers in:
              - [ ] \`.github/workflows/build.yml\`
              - [ ] \`pom.xml\`
              - [ ] \`src/main/resources/extension.properties\`
            - [ ] Test build with new version
            - [ ] Update documentation if needed
            - [ ] Create release after successful testing

            ## Quick Actions

            **Option 1: Auto-update and create PR**
            Trigger the [Auto-Update Workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/auto-update-ghidra.yml) manually

            **Option 2: Create release directly**
            Trigger the [Create Release Workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/create-release.yml) manually after merging updates`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ghidra-update'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes(latestVersion)
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['ghidra-update', 'automation']
              });
              console.log('Created new issue for Ghidra update');
            } else {
              console.log('Issue already exists for this version');
            }
