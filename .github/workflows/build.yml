name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHIDRA_VERSION: 12.1.4
      GHIDRA_DATE: 20260921

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14'

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Download Ghidra
      run: |
        wget --no-verbose -O ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip
        7z x -bd ghidra.zip
        echo "GHIDRA_INSTALL_DIR=$PWD/ghidra_${GHIDRA_VERSION}_PUBLIC" >> "$GITHUB_ENV"

    - name: Build Ghidra extension
      working-directory: extension
      run: gradle buildExtension

    - name: Build Python package
      run: uv build

    - name: Python tests (including headless integration)
      run: uv run --extra headless pytest -v

    - name: Assemble release directory
      run: |
        mkdir release
        cp extension/dist/*.zip release/
        cp dist/*.whl dist/*.tar.gz release/
        cp bridge_mcp_ghidra.py release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhidraMCP-artifact
        path: release/*
